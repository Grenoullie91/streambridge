name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The log output is already redacted, so it is
        safe to paste, but please read it first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: I ran `streambridge play <id>` and MPD queued the track, but playback never started.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StreamBridge version
      placeholder: streambridge 0.1.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `streambridge doctor`, plus your distro and audio server.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: '`journalctl --user -u streambridge --since "-10min" --no-pager`'
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config.toml, with personal paths shortened to `~`.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed cookies, tokens and personal paths from everything above.
          required: true
        - label: I searched the existing issues for this.
