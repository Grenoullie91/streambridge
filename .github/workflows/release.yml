name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but do not publish"
        type: boolean
        default: true

# Only a tag push may create a release. A pull request must never be able to
# publish, so the permissions are granted per job rather than at the top.
permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and the project
        run: |
          python -m pip install --upgrade pip
          # The verification gate below needs the dev extras: it runs pytest,
          # ruff and mypy, not just the build. Installing the project editable
          # with '.[dev]' is what makes that work; "pip install build twine"
          # alone left the gate running with no pytest and failing for a
          # reason that has nothing to do with the code.
          #
          # twine is here for `twine check`, which validates the long
          # description against PyPI's rules. Nothing is uploaded: this project
          # is not published to PyPI, so the distributions are attached to the
          # GitHub release instead. See docs/installation.md.
          pip install -e '.[dev]' build twine

      - name: Verify before publishing
        # A release is the one moment a mistake becomes permanent and public.
        # Nothing is published from a tree that does not pass its own gate.
        run: ./scripts/verify.sh

      - name: Build
        run: python -m build

      - name: Check the distributions
        run: twine check dist/*

      - name: Confirm the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          found="$(python -c "
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          if [ "$tag" != "$found" ]; then
            echo "Tag v${tag} does not match pyproject version ${found}." >&2
            echo "A tag that disagrees with the source is the most confusing release bug there is." >&2
            exit 1
          fi

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --verify-tag stops a release being created for a tag that does not
          # exist, and --generate-notes keeps the changelog honest instead of
          # hand-maintained and drifting.
          gh release create "${GITHUB_REF#refs/tags/}" \
            --verify-tag \
            --generate-notes \
            dist/*

      - name: Upload artefacts (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
