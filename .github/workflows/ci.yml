name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # yt-dlp is a test fixture only. It is never contacted: the subprocess
      # layer is replaced by a fake in tests/unit and tests/integration.
      - name: Install the extractor (test fixture, never invoked)
        run: pip install yt-dlp
      - run: pip install pytest
      - name: Unit and integration tests
        # No network access. Live tests are deselected by pyproject's
        # addopts; the dedicated `live` job below opts in explicitly.
        run: python -m pytest tests/ -v

  build:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke test the built wheel
        run: |
          pip install dist/*.whl
          streambridge --version
          streambridge-server --version
          streambridge --help > /dev/null
          # --check must not require a running MPD or a live network.
          streambridge-server --check

  # Optional: contacts the real upstream service. Never part of the default
  # gate, because it depends on that service being reachable and is
  # rate-limited.
  live:
    name: Live (upstream) - manual only
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest yt-dlp
      - run: python -m pytest tests/live -m live -o addopts="" -v
