name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # yt-dlp is a test fixture only. It is never contacted: the subprocess
      # layer is replaced by a fake in tests/unit and tests/integration.
      - name: Install the extractor (test fixture, never invoked)
        run: pip install yt-dlp
      - run: pip install pytest
      - name: Unit and integration tests
        # No network access. Live tests are deselected by pyproject's
        # addopts; the dedicated `live` job below opts in explicitly.
        run: python -m pytest tests/ -v

  build:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke test the built wheel
        run: |
          pip install dist/*.whl
          streambridge --version
          streambridge-server --version
          streambridge --help > /dev/null
          # The web assets have to arrive inside the wheel. Without this the
          # install succeeds and the interface is simply absent, which is the
          # failure mode a package-data omission produces and the one a version
          # print cannot see.
          python -c "
          import pathlib, sys
          import streambridge.config as c
          assert c.Config().web_enabled, 'web assets missing from the wheel'
          print('web assets present:', c.Config().web_directory)
          "
          # --check reports the environment and exits non-zero when a
          # *required* dependency is missing, so it is run with the two the
          # runner actually has: a stub mpc on PATH and no MPD to talk to.
          # Neither is a code path the wheel can be checked against, and a
          # smoke test that fails for a missing apt package tests the runner.
          #
          # The stub has to work, not just exist: `which` finding the name is
          # not what the check tests, a running mpc is. exit 0 makes it a
          # present-and-answering stand-in.
          mkdir -p "$RUNNER_TEMP/stub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub/mpc"
          chmod +x "$RUNNER_TEMP/stub/mpc"
          # yt-dlp has to report a version, so the stub answers --version.
          cat > "$RUNNER_TEMP/stub/yt-dlp" <<'STUB'
          #!/bin/sh
          for arg in "$@"; do
            case "$arg" in
              --version) echo "2099.01.01"; exit 0 ;;
            esac
          done
          echo "[]"
          STUB
          chmod +x "$RUNNER_TEMP/stub/yt-dlp"
          PATH="$RUNNER_TEMP/stub:$PATH" streambridge-server --check

  # Optional: contacts the real upstream service. Never part of the default
  # gate, because it depends on that service being reachable and is
  # rate-limited.
  live:
    name: Live (upstream) - manual only
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest yt-dlp
      - run: python -m pytest tests/live -m live -o addopts="" -v
