<?xml version="1.0" encoding="utf-8"?>
<!--
  StreamBridge brand mark. The artwork is the project's logo, rendered and
  embedded rather than traced into paths, so this file and the PNGs beside it
  are the same drawing. Regenerate with:

      python3 scripts/make-android-icons.py           android/app/src/main/res src/streambridge/web/assets <logo.png>
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 256 256" width="256" height="256" role="img"
     aria-label="StreamBridge">
  <image x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid meet"
         xlink:href="data:image/png;base64," />
</svg>
